name: Publish Release

on:
  push:
    branches: [master]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  publish:
    name: Publish Browser Extension Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version=$(node -p "require('./package.json').version")
          subject=$(git log -1 --format=%s)

          if [[ "$subject" != "chore(release): v$version" ]]; then
            echo "Not a release commit."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Release tag already exists."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version=$(git show HEAD^:package.json | node -p \
            "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")

          if [[ "$previous_version" == "$version" ]]; then
            echo "Version was not changed."
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: npm ci

      - name: Run checks
        if: steps.release.outputs.publish == 'true'
        run: npm run check

      - name: Package extensions
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          (
            cd dist
            zip -r "../release/mediamanagarr-v${VERSION}-chrome.zip" .
          )

          (
            cd dist
            zip -r "../release/mediamanagarr-v${VERSION}-firefox.zip" .
          )

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "v${VERSION}" \
            release/*.zip \
            --target "$GITHUB_SHA" \
            --title "MediaManagarr v${VERSION}" \
            --generate-notes
