name: Publish Release

on:
  push:
    branches: [master]
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Browser Extension Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify release
        id: release
        run: npm run release:check

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: npm ci

      - name: Run checks and build
        if: steps.release.outputs.publish == 'true'
        run: npm run check

      - name: Verify built manifest
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/manifest.json

          actual=$(node -p "require('./dist/manifest.json').version")

          if [[ "$actual" != "$VERSION" ]]; then
            echo "Manifest version mismatch: $actual != $VERSION"
            exit 1
          fi

          echo "Verified manifest version $actual."

      - name: Package extensions
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          (
            cd dist

            zip -qr \
              "../release/mediamanagarr-v${VERSION}-chrome.zip" \
              .
          )

          (
            cd dist

            zip -qr \
              "../release/mediamanagarr-v${VERSION}-firefox.zip" \
              .
          )

          unzip -t \
            "release/mediamanagarr-v${VERSION}-chrome.zip"

          unzip -t \
            "release/mediamanagarr-v${VERSION}-firefox.zip"

          unzip -p \
            "release/mediamanagarr-v${VERSION}-chrome.zip" \
            manifest.json |
            node -e "
              let input = '';
              process.stdin.on('data', chunk => input += chunk);
              process.stdin.on('end', () => {
                const manifest = JSON.parse(input);
                if (manifest.version !== process.env.VERSION) {
                  process.exit(1);
                }
              });
            "

          unzip -p \
            "release/mediamanagarr-v${VERSION}-firefox.zip" \
            manifest.json |
            node -e "
              let input = '';
              process.stdin.on('data', chunk => input += chunk);
              process.stdin.on('end', () => {
                const manifest = JSON.parse(input);
                if (manifest.version !== process.env.VERSION) {
                  process.exit(1);
                }
              });
            "

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "v${VERSION}" \
            release/*.zip \
            --target "$GITHUB_SHA" \
            --title "MediaManagarr v${VERSION}" \
            --generate-notes
