name: Publish Release

on:
  push:
    branches: [master]
    paths:
      - package.json

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Browser Extension Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify release
        id: release
        run: npm run release:check

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: npm ci

      - name: Build browser extensions
        if: steps.release.outputs.publish == 'true'
        run: npm run build

      - name: Verify browser manifests
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          for browser in chrome firefox; do
            manifest="dist/${browser}/manifest.json"

            if [[ ! -f "$manifest" ]]; then
              echo "Missing ${browser} manifest: $manifest"
              exit 1
            fi

            BROWSER="$browser" node --input-type=module -e '
              import { readFileSync } from "node:fs";

              const browser = process.env.BROWSER;
              const expectedVersion = process.env.VERSION;
              const manifest = JSON.parse(
                readFileSync(`dist/${browser}/manifest.json`, "utf8"),
              );

              if (manifest.version !== expectedVersion) {
                throw new Error(
                  `${browser} manifest version mismatch: ${manifest.version} != ${expectedVersion}`,
                );
              }

              if (browser === "chrome") {
                if (manifest.background?.service_worker !== "background.js") {
                  throw new Error("Chrome manifest is missing its background service worker.");
                }

                if (manifest.browser_specific_settings !== undefined) {
                  throw new Error("Chrome manifest contains Firefox-specific settings.");
                }
              }

              if (browser === "firefox") {
                if (
                  !Array.isArray(manifest.background?.scripts) ||
                  !manifest.background.scripts.includes("background.js")
                ) {
                  throw new Error("Firefox manifest is missing its background script.");
                }
              }

              console.log(`Verified ${browser} manifest v${manifest.version}.`);
            '
          done

      - name: Package browser extensions
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          for browser in chrome firefox; do
            archive="mediamanagarr-v${VERSION}-${browser}.zip"

            (
              cd "dist/${browser}"

              zip -qr "../../release/${archive}" .
            )

            echo "Created release/${archive}"
          done

      - name: Verify release archives
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          for browser in chrome firefox; do
            archive="release/mediamanagarr-v${VERSION}-${browser}.zip"

            if [[ ! -f "$archive" ]]; then
              echo "Missing release archive: $archive"
              exit 1
            fi

            unzip -t "$archive"

            if ! unzip -Z1 "$archive" | grep -Fxq "manifest.json"; then
              echo "$archive does not contain a root-level manifest.json."
              exit 1
            fi

            if ! unzip -Z1 "$archive" | grep -Fxq "background.js"; then
              echo "$archive does not contain a root-level background.js."
              exit 1
            fi

            BROWSER="$browser" unzip -p "$archive" manifest.json |
              BROWSER="$browser" node --input-type=module -e '
                let input = "";

                for await (const chunk of process.stdin) {
                  input += chunk;
                }

                const manifest = JSON.parse(input);
                const browser = process.env.BROWSER;
                const expectedVersion = process.env.VERSION;

                if (manifest.version !== expectedVersion) {
                  throw new Error(
                    `${browser} archive version mismatch: ${manifest.version} != ${expectedVersion}`,
                  );
                }

                if (
                  browser === "chrome" &&
                  manifest.background?.service_worker !== "background.js"
                ) {
                  throw new Error("Chrome archive contains an unexpected manifest.");
                }

                if (
                  browser === "firefox" &&
                  !manifest.background?.scripts?.includes("background.js")
                ) {
                  throw new Error("Firefox archive contains an unexpected manifest.");
                }

                console.log(`Verified ${browser} archive v${manifest.version}.`);
              '
          done

      - name: Inspect existing release
        if: steps.release.outputs.publish == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          tag="v${VERSION}"

          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            tagged_sha=$(git rev-list -n 1 "$tag")

            if [[ "$tagged_sha" != "$RELEASE_SHA" ]]; then
              echo "Tag $tag points to $tagged_sha, expected $RELEASE_SHA."
              exit 1
            fi

            echo "Existing tag points to the correct commit."
          else
            echo "No existing tag."
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: >-
          steps.release.outputs.publish == 'true' &&
          steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "v${VERSION}" \
            --target "$RELEASE_SHA" \
            --title "MediaManagarr v${VERSION}" \
            --generate-notes

      - name: Upload missing release assets
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          tag="v${VERSION}"

          for browser in chrome firefox; do
            archive="mediamanagarr-v${VERSION}-${browser}.zip"

            if gh release view "$tag" \
              --json assets \
              --jq '.assets[].name' |
              grep -Fxq "$archive"; then
              echo "$archive already exists. Skipping."
              continue
            fi

            gh release upload "$tag" "release/$archive"

            echo "Uploaded $archive."
          done

          echo "Release $tag is complete."
