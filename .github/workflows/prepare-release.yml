name: Prepare Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Release Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare release
        run: npm run release:prepare

      - name: Read release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f release-version.txt ]]; then
            echo "No release required."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(cat release-version.txt)

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run checks
        if: steps.release.outputs.ready == 'true'
        run: npm run check

      - name: Create release pull request
        if: steps.release.outputs.ready == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          branch: release/v${{ steps.release.outputs.version }}
          base: master
          delete-branch: true
          commit-message: 'chore(release): v${{ steps.release.outputs.version }}'
          title: 'chore(release): v${{ steps.release.outputs.version }}'
          body: |
            ## MediaManagarr v${{ steps.release.outputs.version }}

            Automated version bump and changelog generation.

            Review the changes and merge this PR when ready to publish.
