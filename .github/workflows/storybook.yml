name: Deploy Storybook

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Production Storybook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test -- --run

      - name: Build application
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook build
        uses: actions/upload-artifact@v4
        with:
          name: production-storybook
          path: storybook-static/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Production Storybook
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout publishing branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          persist-credentials: false

      - name: Download production Storybook
        uses: actions/download-artifact@v4
        with:
          name: production-storybook
          path: production

      - name: Update production site
        shell: bash
        run: |
          mkdir -p site/pr-preview

          find site -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name pr-preview \
            -exec rm -rf {} +

          cp -a production/. site/

          touch site/.nojekyll

      - name: Commit generated website
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No website changes to commit."
          else
            git commit -m "ci: update production Storybook"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:gh-pages
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
