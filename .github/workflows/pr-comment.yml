name: PR Overview Comment

on:
  workflow_run:
    workflows: ['Pull Request']
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  publish:
    name: Update PR Overview
    runs-on: ubuntu-latest

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Download PR report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p report

          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name pr-overview \
            --dir report

      - name: Verify report and update PR description
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          number=$(jq -r '.pr' report/pr-report-metadata.json)
          report_sha=$(jq -r '.sha' report/pr-report-metadata.json)

          if ! [[ "$number" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid PR number."
            exit 1
          fi

          if ! [[ "$report_sha" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "Invalid report SHA."
            exit 1
          fi

          pr=$(gh api "repos/$REPOSITORY/pulls/$number")

          state=$(jq -r '.state' <<< "$pr")
          current_sha=$(jq -r '.head.sha' <<< "$pr")
          head_repo=$(jq -r '.head.repo.full_name' <<< "$pr")

          if [[ "$state" != "open" ||
                "$head_repo" != "$REPOSITORY" ||
                "$current_sha" != "$report_sha" ]]; then
            echo "Skipping closed, external, or outdated PR."
            exit 0
          fi

          # GitHub pull_request workflows may run against a temporary
          # merge commit, so RUN_SHA is not compared with report_sha.

          metadata=$(gh api \
            "repos/$REPOSITORY/contents/pr-preview/pr-$number/deployment.json?ref=gh-pages" \
            2>/dev/null) || metadata=""

          deployed_sha=""

          if [[ -n "$metadata" ]]; then
            deployed_sha=$(
              jq -r '.content' <<< "$metadata" |
                base64 --decode |
                jq -r '.sha // empty'
            )
          fi

          if [[ "$deployed_sha" == "$report_sha" ]]; then
            sed -i \
              's/Status: Pending deployment\./Status: Deployed./' \
              report/pr-overview.md
          fi

          marker="<!-- mediamanagarr-pr-overview -->"

          if ! grep -Fq "$marker" report/pr-overview.md; then
            echo "Missing PR overview marker."
            exit 1
          fi

          existing_body=$(jq -r '.body // ""' <<< "$pr")

          # Remove a previously generated overview section while
          # preserving any manually written PR description.
          manual_body=$(
            printf '%s\n' "$existing_body" |
              sed '/<!-- mediamanagarr-pr-overview -->/,/<!-- mediamanagarr-pr-overview-end -->/d'
          )

          {
            if [[ -n "$manual_body" ]]; then
              printf '%s\n\n' "$manual_body"
            fi

            cat report/pr-overview.md
            printf '\n<!-- mediamanagarr-pr-overview-end -->\n'
          } > updated-body.md

          # Recheck the head SHA before updating the description.
          latest_sha=$(gh api \
            "repos/$REPOSITORY/pulls/$number" \
            --jq '.head.sha')

          if [[ "$latest_sha" != "$report_sha" ]]; then
            echo "PR changed during processing."
            exit 0
          fi

          gh api \
            --method PATCH \
            "repos/$REPOSITORY/pulls/$number" \
            -F body=@updated-body.md

          echo "Updated PR #$number description."

          # Remove an old bot-generated overview comment, if present.
          comment_ids=$(
            gh api \
              "repos/$REPOSITORY/issues/$number/comments" \
              --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- mediamanagarr-pr-overview -->")) | .id'
          )

          while IFS= read -r comment_id; do
            [[ -z "$comment_id" ]] && continue

            gh api \
              --method DELETE \
              "repos/$REPOSITORY/issues/comments/$comment_id"

          done <<< "$comment_ids"
