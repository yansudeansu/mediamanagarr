name: PR Overview Comment

on:
  workflow_run:
    workflows: ['Pull Request']
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  publish:
    name: Publish PR Overview
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Download PR report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name pr-overview \
            --dir report

      - name: Verify report and update comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          number=$(jq -r '.pr' report/pr-report-metadata.json)
          report_sha=$(jq -r '.sha' report/pr-report-metadata.json)

          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number."
            exit 1
          fi

          if ! [[ "$report_sha" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "Invalid report SHA."
            exit 1
          fi

          associated_prs=$(gh api \
            "repos/$REPOSITORY/actions/runs/$RUN_ID/pulls")

          associated=$(jq -r \
            --argjson number "$number" \
            'any(.[]; .number == $number)' \
            <<< "$associated_prs")

          if [[ "$associated" != "true" ]]; then
            echo "Report does not belong to this PR."
            exit 1
          fi

          pr=$(gh api "repos/$REPOSITORY/pulls/$number")

          state=$(jq -r '.state' <<< "$pr")
          current_sha=$(jq -r '.head.sha' <<< "$pr")
          head_repo=$(jq -r '.head.repo.full_name' <<< "$pr")

          if [[ "$state" != "open" ||
                "$current_sha" != "$report_sha" ||
                "$head_repo" != "$REPOSITORY" ]]; then
            echo "PR is closed, external, or has changed."
            exit 0
          fi

          deployed_sha=""

          metadata=$(gh api \
            "repos/$REPOSITORY/contents/pr-preview/pr-$number/deployment.json?ref=gh-pages" \
            2>/dev/null) || metadata=""

          if [[ -n "$metadata" ]]; then
            deployed_sha=$(jq -r '.content' <<< "$metadata" \
              | base64 --decode \
              | jq -r '.sha // empty')
          fi

          if [[ "$deployed_sha" == "$current_sha" ]]; then
            status="Status: Deployed."
          else
            status="Status: Pending deployment."
          fi

          sed -i \
            "s/Status: Pending deployment\\./$status/" \
            report/pr-overview.md

          marker="<!-- mediamanagarr-pr-overview -->"

          if ! grep -Fq "$marker" report/pr-overview.md; then
            echo "Invalid PR report marker."
            exit 1
          fi

          comment_id=$(
            gh api \
              "repos/$REPOSITORY/issues/$number/comments" \
              --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- mediamanagarr-pr-overview -->")) | .id' \
              | head -n 1
          )

          if [[ -n "$comment_id" ]]; then
            gh api \
              --method PATCH \
              "repos/$REPOSITORY/issues/comments/$comment_id" \
              -F body=@report/pr-overview.md

            echo "Updated PR #$number overview."
          else
            gh api \
              --method POST \
              "repos/$REPOSITORY/issues/$number/comments" \
              -F body=@report/pr-overview.md

            echo "Created PR #$number overview."
          fi
