name: PR Overview Comment

on:
  workflow_run:
    workflows: ['Pull Request']
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  publish:
    name: Publish PR Overview
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Download PR report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name pr-overview \
            --dir report

      - name: Publish or update comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';

          const event = JSON.parse(
            readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'),
          );

          const prs = event.workflow_run.pull_requests;

          if (prs.length !== 1) {
            throw new Error('Expected exactly one associated pull request.');
          }

          const prNumber = prs[0].number;
          const [owner, repo] = process.env.REPOSITORY.split('/');
          const body = readFileSync('report/pr-overview.md', 'utf8');

          const marker = '<!-- mediamanagarr-pr-overview -->';

          if (!body.startsWith(marker)) {
            throw new Error('Downloaded report has an invalid marker.');
          }

          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
            'X-GitHub-Api-Version': '2022-11-28',
          };

          async function api(path, options = {}) {
            const response = await fetch(
              `https://api.github.com${path}`,
              { ...options, headers },
            );

            if (!response.ok) {
              throw new Error(
                `GitHub API error: ${response.status} ${await response.text()}`,
              );
            }

            return response.json();
          }

          const comments = [];

          for (let page = 1; ; page += 1) {
            const items = await api(
              `/repos/${owner}/${repo}/issues/${prNumber}/comments?per_page=100&page=${page}`,
            );

            comments.push(...items);

            if (items.length < 100) {
              break;
            }
          }

          const existing = comments.find(
            (comment) =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body?.includes(marker),
          );

          if (existing) {
            await api(
              `/repos/${owner}/${repo}/issues/comments/${existing.id}`,
              {
                method: 'PATCH',
                body: JSON.stringify({ body }),
              },
            );

            console.log(`Updated PR #${prNumber} overview.`);
          } else {
            await api(
              `/repos/${owner}/${repo}/issues/${prNumber}/comments`,
              {
                method: 'POST',
                body: JSON.stringify({ body }),
              },
            );

            console.log(`Created PR #${prNumber} overview.`);
          }
          EOF
