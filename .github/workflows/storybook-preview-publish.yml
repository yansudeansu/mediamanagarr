name: Publish Storybook PR Preview

on:
  workflow_run:
    workflows: ['Storybook PR Preview']
    types: [completed]

  pull_request_target:
    types: [closed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: storybook-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish or Remove PR Preview
    runs-on: ubuntu-latest

    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'closed')

    permissions:
      contents: write
      actions: read
      pull-requests: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download PR build metadata
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p metadata

          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name storybook-pr-metadata \
            --dir metadata

      - name: Identify pull request
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLOSED_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            number=$(jq -r '.pr' metadata/build.json)
            sha=$(jq -r '.sha' metadata/build.json)

            echo "action=publish" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            number="$CLOSED_PR_NUMBER"

            echo "action=remove" >> "$GITHUB_OUTPUT"
          fi

          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request number."
            exit 1
          fi

          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Verify pull request
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          ACTION: ${{ steps.pr.outputs.action }}
          BUILD_SHA: ${{ steps.pr.outputs.sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")

          if [[ "$ACTION" == "publish" ]]; then
            state=$(jq -r '.state' <<< "$pr")
            head_repo=$(jq -r '.head.repo.full_name' <<< "$pr")
            current_sha=$(jq -r '.head.sha' <<< "$pr")

            if [[ "$state" != "open" ]]; then
              echo "PR is no longer open. Skipping publication."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$head_repo" != "$REPOSITORY" ]]; then
              echo "Skipping preview from forked repository."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if ! [[ "$BUILD_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
              echo "Invalid build commit SHA."
              exit 1
            fi

            if [[ "$current_sha" != "$BUILD_SHA" ]]; then
              echo "A newer PR commit exists. Skipping outdated preview."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Verify that the completed run belongs to this PR.
            associated_prs=$(gh api \
              "repos/$REPOSITORY/actions/runs/$RUN_ID/pulls")

            associated=$(jq -r \
              --argjson number "$PR_NUMBER" \
              'any(.[]; .number == $number)' \
              <<< "$associated_prs")

            if [[ "$associated" != "true" ]]; then
              echo "Workflow run is not associated with this PR."
              exit 1
            fi
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout publishing branch
        if: steps.verify.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          persist-credentials: false

      - name: Download Storybook preview
        if: >-
          steps.verify.outputs.proceed == 'true' &&
          steps.pr.outputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p preview

          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name storybook-pr-preview \
            --dir preview

      - name: Update preview directory
        if: steps.verify.outputs.proceed == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          ACTION: ${{ steps.pr.outputs.action }}
          BUILD_SHA: ${{ steps.pr.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          destination="site/pr-preview/pr-$PR_NUMBER"

          rm -rf "$destination"

          if [[ "$ACTION" == "publish" ]]; then
            mkdir -p "$destination"
            cp -a preview/. "$destination/"

            jq -n \
              --argjson pr "$PR_NUMBER" \
              --arg sha "$BUILD_SHA" \
              '{pr: $pr, sha: $sha}' \
              > "$destination/deployment.json"

            echo "Prepared preview for PR #$PR_NUMBER"
          else
            echo "Removed preview for PR #$PR_NUMBER"
          fi

          touch site/.nojekyll

      - name: Commit generated website
        if: steps.verify.outputs.proceed == 'true'
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          ACTION: ${{ steps.pr.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No website changes to commit."
          else
            git commit -m "ci: $ACTION Storybook preview for PR #$PR_NUMBER"

            authorization=$(
              printf 'x-access-token:%s' "$GH_TOKEN" |
                base64 -w0
            )

            git \
              -c "http.extraheader=AUTHORIZATION: basic $authorization" \
              push origin HEAD:gh-pages
          fi

      - name: Configure GitHub Pages
        if: steps.verify.outputs.proceed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload complete website
        if: steps.verify.outputs.proceed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.verify.outputs.proceed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Update PR overview deployment status
        if: >-
          steps.verify.outputs.proceed == 'true' &&
          steps.pr.outputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BUILD_SHA: ${{ steps.pr.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          current_sha=$(gh api \
            "repos/$REPOSITORY/pulls/$PR_NUMBER" \
            --jq '.head.sha')

          if [[ "$current_sha" != "$BUILD_SHA" ]]; then
            echo "PR changed during deployment. Skipping comment update."
            exit 0
          fi

          comment_id=$(
            gh api \
              "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- mediamanagarr-pr-overview -->")) | .id' \
              | head -n 1
          )

          if [[ -z "$comment_id" ]]; then
            echo "PR overview comment not found."
            exit 0
          fi

          body=$(gh api \
            "repos/$REPOSITORY/issues/comments/$comment_id" \
            --jq '.body')

          updated_body="${body/Status: Pending deployment./Status: Deployed.}"

          gh api \
            --method PATCH \
            "repos/$REPOSITORY/issues/comments/$comment_id" \
            -f body="$updated_body"

          echo "Updated PR #$PR_NUMBER preview status."
