name: Publish Storybook PR Preview

on:
  workflow_run:
    workflows:
      - Deploy Storybook
      - Storybook PR Preview
    types: [completed]

  pull_request_target:
    types: [closed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: storybook-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Storybook Website
    runs-on: ubuntu-latest

    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'closed')

    permissions:
      contents: write
      actions: read
      pull-requests: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Identify publishing operation
        id: operation
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          CLOSED_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            echo "type=remove" >> "$GITHUB_OUTPUT"
            echo "number=$CLOSED_PR_NUMBER" >> "$GITHUB_OUTPUT"

          elif [[ "$WORKFLOW_NAME" == "Deploy Storybook" &&
                  ( "$WORKFLOW_EVENT" == "push" ||
                    "$WORKFLOW_EVENT" == "workflow_dispatch" ) ]]; then
            echo "type=production" >> "$GITHUB_OUTPUT"

          elif [[ "$WORKFLOW_NAME" == "Storybook PR Preview" &&
                  "$WORKFLOW_EVENT" == "pull_request" ]]; then
            echo "type=preview" >> "$GITHUB_OUTPUT"

          else
            echo "type=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Download PR metadata
        if: steps.operation.outputs.type == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p metadata

          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name storybook-pr-metadata \
            --dir metadata

      - name: Verify publishing operation
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TYPE: ${{ steps.operation.outputs.type }}
          CLOSED_PR_NUMBER: ${{ steps.operation.outputs.number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        shell: bash
        run: |
          set -euo pipefail

          echo "proceed=false" >> "$GITHUB_OUTPUT"

          if [[ "$TYPE" == "skip" ]]; then
            exit 0
          fi

          if [[ "$TYPE" == "production" ]]; then
            if [[ "$RUN_REPOSITORY" != "$REPOSITORY" ]]; then
              echo "Unexpected production repository."
              exit 1
            fi

            current_master=$(gh api \
              "repos/$REPOSITORY/branches/master" \
              --jq '.commit.sha')

            if [[ "$RUN_SHA" != "$current_master" ]]; then
              echo "Skipping outdated production build."
              exit 0
            fi

          elif [[ "$TYPE" == "preview" ]]; then
            if [[ "$RUN_REPOSITORY" != "$REPOSITORY" ]]; then
              echo "Skipping preview from external repository."
              exit 0
            fi

            number=$(jq -r '.pr' metadata/build.json)
            build_sha=$(jq -r '.sha' metadata/build.json)

            if ! [[ "$number" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid PR number."
              exit 1
            fi

            if ! [[ "$build_sha" =~ ^[a-fA-F0-9]{40}$ ]]; then
              echo "Invalid build SHA."
              exit 1
            fi

            pr=$(gh api "repos/$REPOSITORY/pulls/$number")

            state=$(jq -r '.state' <<< "$pr")
            head_repo=$(jq -r '.head.repo.full_name' <<< "$pr")
            current_sha=$(jq -r '.head.sha' <<< "$pr")

            if [[ "$state" != "open" ||
                  "$head_repo" != "$REPOSITORY" ||
                  "$current_sha" != "$build_sha" ]]; then
              echo "Skipping closed, external, or outdated PR."
              exit 0
            fi

            echo "number=$number" >> "$GITHUB_OUTPUT"
            echo "sha=$build_sha" >> "$GITHUB_OUTPUT"

          elif [[ "$TYPE" == "remove" ]]; then
            if ! [[ "$CLOSED_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid closed PR number."
              exit 1
            fi

            echo "number=$CLOSED_PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout publishing branch
        if: steps.verify.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          persist-credentials: false

      - name: Download production Storybook
        if: >-
          steps.verify.outputs.proceed == 'true' &&
          steps.operation.outputs.type == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p production

          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name production-storybook \
            --dir production

      - name: Download PR Storybook
        if: >-
          steps.verify.outputs.proceed == 'true' &&
          steps.operation.outputs.type == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p preview

          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name storybook-pr-preview \
            --dir preview

      - name: Update website files
        if: steps.verify.outputs.proceed == 'true'
        env:
          TYPE: ${{ steps.operation.outputs.type }}
          PR_NUMBER: ${{ steps.verify.outputs.number }}
          BUILD_SHA: ${{ steps.verify.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$TYPE" == "production" ]]; then
            mkdir -p site/pr-preview

            find site -mindepth 1 -maxdepth 1 \
              ! -name .git \
              ! -name pr-preview \
              -exec rm -rf {} +

            cp -a production/. site/

            echo "Updated production Storybook."

          elif [[ "$TYPE" == "preview" ]]; then
            destination="site/pr-preview/pr-$PR_NUMBER"

            rm -rf "$destination"
            mkdir -p "$destination"

            cp -a preview/. "$destination/"

            jq -n \
              --argjson pr "$PR_NUMBER" \
              --arg sha "$BUILD_SHA" \
              '{pr: $pr, sha: $sha}' \
              > "$destination/deployment.json"

            echo "Updated preview for PR #$PR_NUMBER."

          elif [[ "$TYPE" == "remove" ]]; then
            rm -rf "site/pr-preview/pr-$PR_NUMBER"

            echo "Removed preview for PR #$PR_NUMBER."
          fi

          touch site/.nojekyll

      - name: Commit generated website
        if: steps.verify.outputs.proceed == 'true'
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No website changes to commit."
          else
            git commit -m "ci: update generated Storybook website"

            authorization=$(
              printf 'x-access-token:%s' "$GH_TOKEN" |
                base64 -w0
            )

            git \
              -c "http.extraheader=AUTHORIZATION: basic $authorization" \
              push origin HEAD:gh-pages
          fi

      - name: Configure GitHub Pages
        if: steps.verify.outputs.proceed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload complete website
        if: steps.verify.outputs.proceed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.verify.outputs.proceed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Update PR description deployment status
        if: >-
          steps.verify.outputs.proceed == 'true' &&
          steps.operation.outputs.type == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.verify.outputs.number }}
          BUILD_SHA: ${{ steps.verify.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")

          current_sha=$(jq -r '.head.sha' <<< "$pr")
          state=$(jq -r '.state' <<< "$pr")

          if [[ "$current_sha" != "$BUILD_SHA" ||
                "$state" != "open" ]]; then
            echo "PR changed during deployment."
            exit 0
          fi

          body=$(jq -r '.body // ""' <<< "$pr")

          if [[ "$body" != *"<!-- mediamanagarr-pr-overview -->"* ]]; then
            echo "Generated PR overview not found."
            exit 0
          fi

          printf '%s\n' "$body" |
            sed 's/Status: Pending deployment\./Status: Deployed./' \
            > updated-body.md

          gh api \
            --method PATCH \
            "repos/$REPOSITORY/pulls/$PR_NUMBER" \
            -F body=@updated-body.md

          echo "Updated PR #$PR_NUMBER deployment status."
