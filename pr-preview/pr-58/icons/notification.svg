<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Cut a transparent hole in the MM behind the notification dot -->
    <mask id="notification-cutout">
      <rect width="64" height="64" fill="white" />
      <circle cx="54" cy="13" r="10" fill="black" />
    </mask>
  </defs>

  <!-- MM monogram, with the area behind the dot removed -->
  <g
    fill="none"
    stroke="#22c55e"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    mask="url(#notification-cutout)"
  >
    <path d="M7 48 V17 L19 34 L31 17 V48" />
    <path d="M31 48 V17 L43 34 L55 17 V48" />
  </g>

  <!-- Notification dot -->
  <circle
    cx="54"
    cy="13"
    r="6"
    fill="#22c55e"
  />
</svg>